<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat &amp; Mouse Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same three faces as the design artboard, so the app and the artboard match.
     They come from Google Fonts, which is the one network dependency left; the CSS
     stack falls back to system faces that keep the layout intact if it is unavailable.
     For a guaranteed-offline shoot, run tools/vendor_fonts.sh to self-host them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="stage">
    <div id="root"></div>
  </div>
  <script src="js/env.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/net.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
