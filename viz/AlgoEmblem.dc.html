<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 40 40" width="100%" height="100%" style="display:block;overflow:visible">
  <sc-if value="{{ isPpo }}" hint-placeholder-val="{{ true }}">
    <g fill="none" stroke="{{ stroke }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="15.2" opacity="0.85"></circle>
      <path d="M9.4 26.6 L16.6 19.6 L22.4 23.2 L30.8 12.4" stroke-width="2.8"></path>
      <path d="M26.8 12.4 L30.8 12.4 L30.8 16.4"></path>
      <path d="M7.2 12.6 L14.6 12.6" opacity="0.5"></path>
      <path d="M25.4 30.2 L32.8 30.2" opacity="0.5"></path>
    </g>
  </sc-if>
  <sc-if value="{{ isGa }}">
    <g fill="none" stroke="{{ stroke }}" stroke-width="2.4" stroke-linecap="round">
      <path d="M11 5 C 28 13, 12 19, 29 27 C 22 32, 16 33, 11 35" opacity="0.9"></path>
      <path d="M29 5 C 12 13, 28 19, 11 27 C 18 32, 24 33, 29 35" opacity="0.9"></path>
      <path d="M13.6 10.2 L26.4 10.2" stroke-width="2" opacity="0.75"></path>
      <path d="M14.8 19 L25.2 19" stroke-width="2" opacity="0.75"></path>
      <path d="M13.6 27.8 L26.4 27.8" stroke-width="2" opacity="0.75"></path>
    </g>
  </sc-if>
  <sc-if value="{{ isCma }}">
    <g fill="none" stroke="{{ stroke }}" stroke-width="2.4" stroke-linecap="round">
      <ellipse cx="20" cy="20" rx="16.4" ry="8.6" transform="rotate(-32 20 20)" opacity="0.9"></ellipse>
      <ellipse cx="20" cy="20" rx="8.6" ry="4.4" transform="rotate(-32 20 20)" stroke-width="1.9" opacity="0.6"></ellipse>
      <circle cx="20" cy="20" r="2.1" fill="{{ stroke }}" stroke="none"></circle>
      <circle cx="30.4" cy="12.6" r="1.5" fill="{{ stroke }}" stroke="none" opacity="0.7"></circle>
      <circle cx="10.4" cy="26.4" r="1.5" fill="{{ stroke }}" stroke="none" opacity="0.7"></circle>
      <circle cx="25.6" cy="26.8" r="1.3" fill="{{ stroke }}" stroke="none" opacity="0.45"></circle>
    </g>
  </sc-if>
</svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:72,&quot;height&quot;:72},&quot;algo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ppo&quot;,&quot;ga&quot;,&quot;cmaes&quot;],&quot;default&quot;:&quot;ppo&quot;,&quot;tsType&quot;:&quot;'ppo'|'ga'|'cmaes'&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#4ea8ff&quot;,&quot;#3ddc84&quot;,&quot;#a97cff&quot;,&quot;#e8eefb&quot;],&quot;default&quot;:&quot;#4ea8ff&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = (this.props.algo || 'ppo').toLowerCase();
    return {
      isPpo: a === 'ppo',
      isGa: a === 'ga',
      isCma: a === 'cmaes' || a === 'cma-es' || a === 'cma',
      stroke: this.props.color || '#8fb6e6'
    };
  }
}

</script>
</body>
</html>
